name: Publicar CAMINHOS no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  preparar:
    name: Verificar e preparar site
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v6
      - name: Validar arquivos e JavaScript
        run: |
          set -eu
          for arq in index.html styles.css theme-classic.css game.js achievements.js dynasty.js family-support.js skills.js everyday.js random-events.js life-extras.js career-paths.js sim-world.js ui-familiar.js cloud.js cloud-config.js manifest.webmanifest app-icon.svg; do
            test -s "$arq" || { echo "Arquivo ausente ou vazio: $arq"; exit 1; }
          done
          node --check game.js
          node --check achievements.js
          node --check dynasty.js
          node --check family-support.js
          node --check skills.js
          node --check everyday.js
          node --check random-events.js
          node --check life-extras.js
          node --check career-paths.js
          node --check sim-world.js
          node --check ui-familiar.js
          node --check cloud.js
          node --check cloud-config.js
          node tests/smoke.cjs
      - name: Empacotar somente arquivos publicos
        run: |
          mkdir -p _site
          cp index.html styles.css theme-classic.css game.js achievements.js dynasty.js family-support.js skills.js everyday.js random-events.js life-extras.js career-paths.js sim-world.js ui-familiar.js cloud.js cloud-config.js manifest.webmanifest app-icon.svg _site/
          touch _site/.nojekyll
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Enviar site para publicacao
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  publicar:
    name: Publicar site
    needs: preparar
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
